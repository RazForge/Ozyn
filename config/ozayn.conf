# OZAYN Configuration
# Lines starting with # are comments
# Empty lines are ignored

# Runtime loop interval in seconds (1-60)
runtime_interval = 1

# Log level: debug, info, warning, error, critical
log_level = info

# Console logging (1=on, 0=off)
log_console = 1

# File logging (1=on, 0=off)
log_file = 1

# Log directory (relative or absolute)
log_directory = logs

# Config format version (for future migration)
config_version = 1

# Maximum registered modules (1-16)
module_max = 16

# Plugin search directory (relative or absolute)
plugin_dir = plugins

# IPC Configuration
# Enable IPC communication bus (1=on, 0=off)
ipc_enabled = 1

# Unix socket endpoint (relative or absolute path)
ipc_endpoint = runtime/ipc/ozayn.sock

# Max IPC message size in bytes (default: 1048576 = 1 MB)
ipc_max_msg_size = 1048576

# Max concurrent IPC connections (default: 16)
ipc_max_connections = 16

# Service Registry Configuration
# Enable service discovery registry (1=on, 0=off)
registry_enabled = 1

# Maximum registered services (default: 32)
registry_max_services = 32

# Security Configuration
# Enable security subsystem (1=on, 0=off)
security_enabled = 1

# Authentication mode:
#   0 = none (no authentication)
#   1 = trust-all (development only, accepts all connections)
#   2 = uid-check (verify Unix UID against allowed list)
#   3 = credential (future: token-based)
security_auth_mode = 2

# Enable security audit logging (1=on, 0=off)
security_audit_log = 1

# Comma-separated list of allowed UIDs (empty = allow current user only)
# Example: security_allowed_uids = 1000,1001,1002
security_allowed_uids =
