<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozayn</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-body">
    <div class="titlebar">
        <span class="titlebar-title">OZAYN</span>
        <div class="titlebar-controls">
            <button class="titlebar-btn" data-action="minimize">&#8722;</button>
            <button class="titlebar-btn" data-action="maximize">&#9633;</button>
            <button class="titlebar-btn close" data-action="close">&#10005;</button>
        </div>
    </div>

    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>OZAYN</h2>
            </div>
            <div class="sidebar-section">
                <h3>Conversations</h3>
                <ul id="conversations-list"></ul>
                <button class="text-btn" id="new-chat-btn">+ New Chat</button>
            </div>
            <div class="sidebar-section">
                <h3>Projects</h3>
                <ul id="projects-list"></ul>
                <button class="text-btn" id="add-project-btn">+ New Project</button>
            </div>
            <div class="sidebar-footer">
                <span id="user-info"></span>
                <button class="icon-btn" id="logout-btn" title="Logout" style="width:32px;height:32px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>

        <div class="main-content">
            <!-- Chat View -->
            <div id="chat-view" class="view active">
                <div class="chat-header">
                    <h3 id="chat-title">New Conversation</h3>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message system">How can I help you today?</div>
                </div>
                <div class="chat-input-area">
                    <button class="icon-btn" id="upload-btn" title="Upload File">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="chat-input" placeholder="Message Ozayn..." rows="1"></textarea>
                    <button class="icon-btn send-btn" id="send-btn" title="Send">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Projects View -->
            <div id="projects-view" class="view">
                <div class="view-header">
                    <h3>Projects</h3>
                    <button class="text-btn" id="add-project-btn-2">+ New Project</button>
                </div>
                <div class="view-content" id="projects-grid"></div>
            </div>

            <!-- Tasks View -->
            <div id="tasks-view" class="view">
                <div class="view-header">
                    <h3>Tasks</h3>
                    <button class="text-btn" id="add-task-btn">+ New Task</button>
                </div>
                <div class="view-content" id="tasks-list"></div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="view">
                <div class="view-header">
                    <h3>Settings</h3>
                </div>
                <div class="settings-content">
                    <div class="setting-group">
                        <h4>AI Configuration</h4>
                        <label>API Provider</label>
                        <select id="ai-provider">
                            <option value="demo">Demo Mode (No API)</option>
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="ollama">Ollama (Local)</option>
                        </select>
                        <label>API Key</label>
                        <input type="password" id="ai-apikey" placeholder="Enter API key">
                        <label>Model</label>
                        <input type="text" id="ai-model" placeholder="e.g. gpt-3.5-turbo">
                    </div>
                    <div class="setting-group">
                        <h4>Voice</h4>
                        <label>Voice Language</label>
                        <select id="voice-language">
                            <option value="en-US">English (US)</option>
                            <option value="am-ET">Amharic</option>
                            <option value="om-ET">Afaan Oromo</option>
                        </select>
                    </div>
                    <button class="text-btn" id="save-settings-btn" style="padding:10px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav (for tasks/projects switching) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-view="chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chat</span>
        </button>
        <button class="nav-btn" data-view="projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Projects</span>
        </button>
        <button class="nav-btn" data-view="tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </button>
    </nav>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title"></h3>
            <div id="modal-content"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn-primary" id="modal-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
