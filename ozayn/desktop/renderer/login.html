<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozayn</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-bg-orb orb1"></div>
    <div class="auth-bg-orb orb2"></div>

    <div class="auth-container glass">
        <div class="logo">
            <div class="logo-icon">&#x2B21;</div>
            <h1>OZAYN</h1>
            <p>Personal AI Digital Twin</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login">Login</button>
            <button class="tab-btn" id="tab-register">Register</button>
        </div>

        <form id="login-form" class="auth-form active">
            <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="login-btn">Login</button>
        </form>

        <form id="register-form" class="auth-form">
            <input type="text" id="reg-username" placeholder="Username" required autocomplete="username">
            <input type="email" id="reg-email" placeholder="Email (optional)">
            <input type="text" id="reg-fullname" placeholder="Full Name (optional)">
            <input type="password" id="reg-password" placeholder="Password" required autocomplete="new-password">
            <button type="submit" id="reg-btn">Register</button>
        </form>

        <div id="auth-error" class="error-message"></div>
        <div id="server-status" class="server-status"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
