<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARWE Dashboard - Ozayn</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e80; }
        .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef444480; }
        .status-dot.warning { background: #f59e0b; box-shadow: 0 0 8px #f59e0b80; }
        .metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: var(--text-secondary); font-size: 13px; }
        .metric-value { font-weight: 500; font-size: 13px; }
        .bar-container { height: 6px; background: var(--bg-tertiary); border-radius: 3px; margin-top: 8px; }
        .bar { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .bar.green { background: #22c55e; }
        .bar.blue { background: #3b82f6; }
        .bar.yellow { background: #f59e0b; }
        .bar.red { background: #ef4444; }
        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .full-width { grid-column: 1 / -1; }
        .log-entry { padding: 8px; background: var(--bg-primary); border-radius: 6px; margin-bottom: 8px; font-family: monospace; font-size: 12px; }
        .log-time { color: var(--text-secondary); }
        .log-system { color: var(--accent); font-weight: 600; }
        .log-message { color: var(--text-primary); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .refresh-btn { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>ARWE System Dashboard</h1>
            <div style="display: flex; gap: 8px;">
                <a href="/ozayn/config" class="btn btn-secondary">API Config</a>
                <a href="/ozayn/3d" class="btn btn-secondary">3D View</a>
                <a href="/" class="btn btn-secondary">Back to Chat</a>
                <button class="refresh-btn" onclick="refreshAll()">Refresh All</button>
            </div>
        </div>

        <div class="grid" id="systems-grid"></div>

        <div class="card full-width" style="margin-top: 16px;">
            <div class="card-header">
                <div class="card-title">System Activity Log</div>
                <button class="btn btn-secondary" onclick="clearLog()">Clear</button>
            </div>
            <div id="activity-log" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/ozayn/backend/api';
        let sessionId = localStorage.getItem('ozayn_session');

        const SYSTEMS = {
            edunex: { name: 'Edunex', icon: '📚', desc: 'Education Platform' },
            govyx: { name: 'Govyx', icon: '🏛️', desc: 'Government Services' },
            locify: { name: 'Locify', icon: '📍', desc: 'Digital Identity' },
            terrachain: { name: 'TerraChain', icon: '🌍', desc: 'Land Transparency' },
            bilen: { name: 'Bilen', icon: '🛡️', desc: 'Security Intelligence' },
            kidane: { name: 'Kidane', icon: '🚁', desc: 'Aerial Robotics Fleet' },
            canivox: { name: 'Canivox', icon: '🤖', desc: 'Ground Robotics Fleet' }
        };

        async function init() {
            if (!sessionId) {
                window.location.href = '/';
                return;
            }
            await refreshAll();
            setInterval(refreshAll, 30000);
        }

        async function refreshAll() {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;">Loading...</div>';

            try {
                const res = await fetch(`${API_BASE}/arwe/status`, {
                    headers: { 'X-Session-ID': sessionId }
                });
                const data = await res.json();
                renderSystems(data);
                addLog('system', 'Dashboard refreshed');
            } catch (e) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#ef4444;">Error: ${e.message}</div>`;
            }
        }

        function renderSystems(data) {
            const grid = document.getElementById('systems-grid');
            grid.innerHTML = '';

            for (const [key, system] of Object.entries(SYSTEMS)) {
                const status = data[key] || {};
                const isOnline = status.status === 'online';
                const metrics = status.metrics || {};

                let metricsHtml = '';
                for (const [mKey, mValue] of Object.entries(metrics)) {
                    const barClass = mKey.includes('cpu') || mKey.includes('usage') ? 
                        (mValue > 80 ? 'red' : mValue > 50 ? 'yellow' : 'green') : 'blue';
                    metricsHtml += `
                        <div class="metric">
                            <span class="metric-label">${mKey.replace(/_/g, ' ')}</span>
                            <span class="metric-value">${mValue}${typeof mValue === 'number' && mKey.includes('rate') ? '%' : ''}</span>
                        </div>
                        ${typeof mValue === 'number' && mKey.includes('rate') ? `
                            <div class="bar-container">
                                <div class="bar ${barClass}" style="width: ${Math.min(mValue, 100)}%"></div>
                            </div>
                        ` : ''}
                    `;
                }

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:24px;">${system.icon}</span>
                                <div>
                                    <div class="card-title">${system.name}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">${system.desc}</div>
                                </div>
                            </div>
                            <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                        </div>
                        ${metricsHtml || '<div style="color:var(--text-secondary);font-size:13px;">No metrics available</div>'}
                        <div class="actions">
                            <button class="btn btn-primary" onclick="testSystem('${key}')">Test</button>
                            <button class="btn btn-secondary" onclick="viewDetails('${key}')">Details</button>
                        </div>
                    </div>
                `;
            }
        }

        async function testSystem(key) {
            addLog(key, 'Testing connection...');
            try {
                const res = await fetch(`${API_BASE}/arwe/config/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Session-ID': sessionId },
                    body: JSON.stringify({ system: key })
                });
                const data = await res.json();
                addLog(key, data.success ? `Connected (${data.duration_ms}ms)` : `Failed: ${data.error}`);
            } catch (e) {
                addLog(key, `Error: ${e.message}`);
            }
        }

        function viewDetails(key) {
            addLog(key, 'Viewing details...');
        }

        function addLog(system, message) {
            const log = document.getElementById('activity-log');
            const time = new Date().toLocaleTimeString();
            log.innerHTML = `
                <div class="log-entry">
                    <span class="log-time">${time}</span>
                    <span class="log-system">[${system}]</span>
                    <span class="log-message">${message}</span>
                </div>
            ` + log.innerHTML;
        }

        function clearLog() {
            document.getElementById('activity-log').innerHTML = '';
        }

        init();
    </script>
</body>
</html>
