<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozayn 3D Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #canvas-container { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #ui-overlay > * {
            pointer-events: auto;
        }
        .panel {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
        }
        .top-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-bar h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .side-panel {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 300px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .side-panel h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #a855f7;
        }
        .system-node {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .system-node:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.5);
        }
        .system-node.active {
            background: rgba(168, 85, 247, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .system-icon { font-size: 20px; }
        .system-info { flex: 1; }
        .system-name { font-size: 13px; font-weight: 500; }
        .system-status { font-size: 11px; color: #22c55e; }
        .system-status.offline { color: #ef4444; }
        .bottom-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .control-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.5);
        }
        .control-btn.active {
            background: rgba(168, 85, 247, 0.4);
        }
        .stats-panel {
            position: absolute;
            bottom: 16px;
            left: 16px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .stat-label { color: #888; }
        .stat-value { color: #a855f7; font-weight: 500; }
        .voice-indicator {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }
        .voice-indicator.active {
            display: flex;
        }
        .voice-bar {
            width: 4px;
            height: 20px;
            background: #a855f7;
            margin: 0 2px;
            border-radius: 2px;
            animation: voicePulse 0.5s ease-in-out infinite alternate;
        }
        .voice-bar:nth-child(2) { animation-delay: 0.1s; }
        .voice-bar:nth-child(3) { animation-delay: 0.2s; }
        .voice-bar:nth-child(4) { animation-delay: 0.3s; }
        .voice-bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes voicePulse {
            from { height: 5px; }
            to { height: 25px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="top-bar panel">
            <h1>OZAYN 3D</h1>
            <button class="control-btn" onclick="toggleRotation()">Auto Rotate</button>
            <button class="control-btn" onclick="resetView()">Reset View</button>
            <a href="/" class="control-btn">Back to Chat</a>
        </div>

        <div class="side-panel panel">
            <h3>ARWE Systems</h3>
            <div id="systems-list"></div>
        </div>

        <div class="stats-panel panel">
            <div class="stat-row">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="fps">60</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Objects</span>
                <span class="stat-value" id="obj-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Connections</span>
                <span class="stat-value" id="conn-count">0</span>
            </div>
        </div>

        <div class="voice-indicator" id="voice-indicator">
            <div class="voice-bar"></div>
            <div class="voice-bar"></div>
            <div class="voice-bar"></div>
            <div class="voice-bar"></div>
            <div class="voice-bar"></div>
        </div>

        <div class="bottom-bar">
            <button class="control-btn" onclick="toggleVoice()">🎤 Voice</button>
            <button class="control-btn" onclick="toggleParticles()">✨ Particles</button>
            <button class="control-btn" onclick="toggleGrid()">📐 Grid</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let systems = {};
        let systemMeshes = {};
        let connections = [];
        let particles;
        let gridHelper;
        let autoRotate = true;
        let showParticles = true;
        let showGrid = true;
        let frameCount = 0;
        let lastTime = performance.now();

        const ARWE_SYSTEMS = [
            { id: 'ozayn', name: 'Ozayn', icon: '🧠', color: 0xa855f7, pos: [0, 0, 0] },
            { id: 'edunex', name: 'Edunex', icon: '📚', color: 0x3b82f6, pos: [3, 1, 0] },
            { id: 'govyx', name: 'Govyx', icon: '🏛️', color: 0x22c55e, pos: [3, -1, 0] },
            { id: 'locify', name: 'Locify', icon: '📍', color: 0xf59e0b, pos: [-3, 1, 0] },
            { id: 'terrachain', name: 'TerraChain', icon: '🌍', color: 0x10b981, pos: [-3, -1, 0] },
            { id: 'bilen', name: 'Bilen', icon: '🛡️', color: 0xef4444, pos: [0, 2, 2] },
            { id: 'kidane', name: 'Kidane', icon: '🚁', color: 0x06b6d4, pos: [0, -2, 2] },
            { id: 'canivox', name: 'Canivox', icon: '🤖', color: 0x8b5cf6, pos: [0, 0, -3] }
        ];

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a0f, 0.05);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xa855f7, 1, 100);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Grid
            gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Create system nodes
            createSystemNodes();

            // Create connections
            createConnections();

            // Create particles
            createParticles();

            // Render systems list
            renderSystemsList();

            // Controls (simple orbit)
            setupControls();

            // Start animation
            animate();

            // Handle resize
            window.addEventListener('resize', onResize);
        }

        function createSystemNodes() {
            ARWE_SYSTEMS.forEach(system => {
                // Main sphere
                const geometry = new THREE.SphereGeometry(0.3, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: system.color,
                    emissive: system.color,
                    emissiveIntensity: 0.3,
                    shininess: 100
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(...system.pos);
                mesh.userData = system;
                scene.add(mesh);
                systemMeshes[system.id] = mesh;

                // Glow ring
                const ringGeometry = new THREE.RingGeometry(0.4, 0.5, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: system.color,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.position.set(...system.pos);
                ring.lookAt(camera.position);
                scene.add(ring);
                systemMeshes[system.id + '_ring'] = ring;
            });
        }

        function createConnections() {
            const ozaynPos = ARWE_SYSTEMS[0].pos;
            
            ARWE_SYSTEMS.slice(1).forEach(system => {
                const points = [
                    new THREE.Vector3(...ozaynPos),
                    new THREE.Vector3(...system.pos)
                ];
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({
                    color: 0x444444,
                    transparent: true,
                    opacity: 0.5
                });
                const line = new THREE.Line(geometry, material);
                scene.add(line);
                connections.push(line);

                // Animated particle along connection
                const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                const particleMaterial = new THREE.MeshBasicMaterial({ color: system.color });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.userData = { start: new THREE.Vector3(...ozaynPos), end: new THREE.Vector3(...system.pos), t: Math.random() };
                scene.add(particle);
                connections.push(particle);
            });
        }

        function createParticles() {
            const particleCount = 500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                const color = new THREE.Color();
                color.setHSL(0.7 + Math.random() * 0.2, 0.8, 0.5);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true,
                transparent: true,
                opacity: 0.6
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function renderSystemsList() {
            const container = document.getElementById('systems-list');
            container.innerHTML = ARWE_SYSTEMS.map(s => `
                <div class="system-node" onclick="focusSystem('${s.id}')">
                    <span class="system-icon">${s.icon}</span>
                    <div class="system-info">
                        <div class="system-name">${s.name}</div>
                        <div class="system-status">Connected</div>
                    </div>
                </div>
            `).join('');
        }

        function setupControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                const radius = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
                const theta = Math.atan2(camera.position.z, camera.position.x);
                
                const newTheta = theta - deltaMove.x * 0.01;
                const newPhi = Math.acos(Math.min(1, Math.max(-1, camera.position.y / radius + deltaMove.y * 0.01)));
                
                camera.position.x = radius * Math.sin(newPhi) * Math.cos(newTheta);
                camera.position.z = radius * Math.sin(newPhi) * Math.sin(newTheta);
                camera.position.y = radius * Math.cos(newPhi);
                camera.lookAt(0, 0, 0);

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

            renderer.domElement.addEventListener('wheel', (e) => {
                const zoom = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(zoom);
                camera.position.clampLength(3, 20);
            });
        }

        function focusSystem(id) {
            const mesh = systemMeshes[id];
            if (mesh) {
                const target = mesh.position.clone();
                const offset = new THREE.Vector3(2, 1, 2);
                animateCamera(target.clone().add(offset), target);
            }
        }

        function animateCamera(targetPos, lookAt) {
            const startPos = camera.position.clone();
            const startLookAt = new THREE.Vector3(0, 0, 0);
            let t = 0;

            function update() {
                t += 0.02;
                if (t >= 1) {
                    camera.position.copy(targetPos);
                    camera.lookAt(lookAt);
                    return;
                }

                camera.position.lerpVectors(startPos, targetPos, t);
                camera.lookAt(lookAt);
                requestAnimationFrame(update);
            }
            update();
        }

        function toggleRotation() {
            autoRotate = !autoRotate;
            document.querySelector('.control-btn').classList.toggle('active', autoRotate);
        }

        function resetView() {
            animateCamera(new THREE.Vector3(0, 3, 8), new THREE.Vector3(0, 0, 0));
        }

        function toggleVoice() {
            const indicator = document.getElementById('voice-indicator');
            indicator.classList.toggle('active');
        }

        function toggleParticles() {
            showParticles = !showParticles;
            particles.visible = showParticles;
        }

        function toggleGrid() {
            showGrid = !showGrid;
            gridHelper.visible = showGrid;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Rotate system nodes
            Object.keys(systemMeshes).forEach(id => {
                if (!id.endsWith('_ring')) {
                    const mesh = systemMeshes[id];
                    mesh.rotation.y += 0.01;
                    mesh.position.y += Math.sin(time + mesh.position.x) * 0.001;
                }
            });

            // Animate connections
            connections.forEach(conn => {
                if (conn.userData && conn.userData.start) {
                    conn.userData.t = (conn.userData.t + 0.005) % 1;
                    const pos = conn.userData.start.clone().lerp(conn.userData.end, conn.userData.t);
                    conn.position.copy(pos);
                }
            });

            // Rotate particles
            if (particles && showParticles) {
                particles.rotation.y += 0.0005;
            }

            // Auto rotate camera
            if (autoRotate) {
                const radius = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
                const theta = Math.atan2(camera.position.z, camera.position.x);
                const newTheta = theta + 0.002;
                camera.position.x = radius * Math.cos(newTheta);
                camera.position.z = radius * Math.sin(newTheta);
                camera.lookAt(0, 0, 0);
            }

            // Update stats
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                document.getElementById('obj-count').textContent = scene.children.length;
                document.getElementById('conn-count').textContent = connections.length;
                frameCount = 0;
                lastTime = now;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
